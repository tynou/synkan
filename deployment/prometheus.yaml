global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: "synkan-monitor"

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "backend:8080" ]
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]
  - job_name: "tempo"
    static_configs:
      - targets:
        - "tempo:3200"
services:
  backend:
    container_name: slate-backend
    build:
      context: ./backend/Slate.API
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=slate;Username=postgres;Password=1234
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5234:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - slate
  
  postgres:
    image: postgres:18-alpine
    container_name: slate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - slate
  
  redis:
    image: redis:8-alpine
    container_name: slate-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - slate
  
  redis-insight:
    image: redis/redisinsight:3.6
    container_name: slate-redis-insight
    restart: unless-stopped
    volumes:
      - redis_insight_data:/data
    ports:
      - "5540:5540"
    networks:
      - slate

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:

networks:
  slate:
    driver: bridge

services:
  gateway:
    image: caddy:2-alpine
    container_name: synkan-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend
    networks:
      - synkan
  
  backend:
    container_name: synkan-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=synkan;Username=postgres;Password=1234
      ConnectionStrings__Redis: redis:6379
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis
    networks:
      - synkan
  
  frontend:
    container_name: synkan-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"
      - "443"
    networks:
      - synkan
  
  postgres:
    image: postgres:18-alpine
    container_name: synkan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    networks:
      - synkan
  
  redis:
    image: redis:8-alpine
    container_name: synkan-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - synkan
  
  redis-insight:
    image: redis/redisinsight:3.6
    container_name: synkan-redis-insight
    restart: unless-stopped
    volumes:
      - redis_insight_data:/data
    expose:
      - "5540"
    environment:
      - RI_PROXY_PATH=/redis
    networks:
      - synkan
  
  prometheus:
    image: prom/prometheus:v3
    container_name: synkan-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./deployment/prometheus.yaml:/etc/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    networks:
      - synkan
  
  loki:
    image: grafana/loki:3.7.3
    container_name: synkan-loki
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - synkan
  
  tempo:
    image: grafana/tempo:3.0.2
    container_name: synkan-tempo
    restart: unless-stopped
    expose:
      - "3200"
      - "4317" # OTLP gRPC receiver
      - "4318" # OTLP HTTP receiver
    volumes:
      - ./deployment/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - synkan
  
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: synkan-alloy
    restart: unless-stopped
    volumes:
      - ./deployment/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.ui-path-prefix=/alloy
    expose:
      - "12345"
      - "4317" # OTLP gRPC
    environment:
      - ALLOY_OTLP_UPSTREAM=tempo:4317
    networks:
      - synkan
    depends_on:
      - loki
      - tempo
  
  grafana:
    image: grafana/grafana:13.1.0
    container_name: synkan-grafana
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - synkan

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:
  prometheus_data:
  loki_data:
  tempo-data:
  grafana_data:

networks:
  synkan:
    driver: bridge
